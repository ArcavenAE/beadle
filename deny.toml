# cargo-deny config — supply-chain advisories, license, and ban checks.
# Run: cargo deny check advisories licenses bans
# CI: EmbarkStudios/cargo-deny-action pinned by SHA in .github/workflows/ci.yml.

[advisories]
version = 2
yanked = "warn"
ignore = [
    # chrono 0.4 is unmaintained per RUSTSEC-2026-0543, with no patched version.
    # It reaches beadle only through crates/director-envelope, in the three
    # date-time fields of the typify-generated envelope.gen.rs. The migration
    # (jiff or time) belongs to director's envelope contract and generator: the
    # wire form is 3, 6 or 9 fractional digits plus a :60 leap second, which a
    # swap must reproduce. Re-check 2026-12-18.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no patched version; via director-envelope's typify-generated envelope.gen.rs; migration belongs to director's envelope contract and generator; re-check 2026-12-18" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # MIT-0 (MIT No Attribution): borrow-or-share, reached through the
    # jsonschema validator in crates/director-envelope.
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
